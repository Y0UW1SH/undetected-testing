name: SEO tracking

on:
  schedule:
    # Daily; keep volume low so the shared Actions IP pool stays usable.
    - cron: "41 9 * * *"
  workflow_dispatch:
    inputs:
      config:
        description: "JSON config path"
        default: "seo/config/keywords.json"
      canary_only:
        description: "Only measure the Google challenge rate"
        type: boolean
        default: false
      capture_serp:
        description: "Also save the live web-search page for this query as data/live_serp.html (parser fixture)"
        default: ""
      capture_extra:
        description: "Extra pages to capture as fixtures: kind:query pairs separated by commas, kinds amazon|ebay|reddit|maps|taostats, e.g. amazon:wireless mouse,ebay:wireless mouse,reddit:plumber austin,taostats:"
        default: ""

permissions:
  contents: write

concurrency:
  group: seo-tracking
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PY_COLORS: "1"
      # Committed back to the repo so fetched-today de-duplication,
      # snapshot diffs and rank history survive between runs.
      SEO_DB: data/ci.sqlite
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: Canary (how often does Google challenge this runner?)
        run: |
          python -m seo --db "$SEO_DB" canary --queries 5 --per-session 1 \
            --fail-above 80 || echo "::warning::High challenge rate"

      - name: Capture a live SERP as a parser fixture
        if: ${{ inputs.capture_serp != '' }}
        env:
          CAPTURE_QUERY: ${{ inputs.capture_serp }}
        run: |
          python -m seo --db "$SEO_DB" capture serp "$CAPTURE_QUERY" \
            --out data/live_serp.html
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from seo.serp.google import parse_serp
          html = open("data/live_serp.html", encoding="utf-8").read()
          parsed = parse_serp(html, "capture")
          for key, items in parsed.items():
              print("%-12s %d" % (key, len(items)))
              for r in items[:5]:
                  print("   ", r.position, r.result_type, r.domain, (r.title or "")[:70])
          PY

      - name: Capture extra pages as fixtures
        if: ${{ inputs.capture_extra != '' }}
        env:
          CAPTURE_EXTRA: ${{ inputs.capture_extra }}
        run: |
          IFS=',' read -ra PAIRS <<< "$CAPTURE_EXTRA"
          for pair in "${PAIRS[@]}"; do
            kind="${pair%%:*}"; query="${pair#*:}"
            kind="$(echo "$kind" | xargs)"; query="$(echo "$query" | xargs)"
            [ -z "$kind" ] && continue
            echo "::group::capture $kind '$query'"
            python -m seo --db "$SEO_DB" capture "$kind" "$query" \
              --out "data/live_${kind}.html" || echo "::warning::capture $kind failed"
            echo "::endgroup::"
          done

      - name: Run tracked keywords
        if: ${{ inputs.canary_only != true }}
        env:
          SEO_PROXY: ${{ secrets.SEO_PROXY }}
        run: |
          CONFIG="${{ inputs.config || 'seo/config/keywords.json' }}"
          if [ ! -f "$CONFIG" ]; then
            echo "::notice::$CONFIG not found; copying the example"
            cp seo/config/keywords.example.json "$CONFIG"
          fi
          PROXY_ARG=""
          if [ -n "$SEO_PROXY" ]; then PROXY_ARG="--proxy $SEO_PROXY"; fi
          python -m seo --db "$SEO_DB" batch --config "$CONFIG" \
            --per-session 3 --on-challenge stop $PROXY_ARG

      - name: Export tables
        if: always()
        run: python -m seo --db "$SEO_DB" export --format csv

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: seo-results
          path: |
            data/
            downloaded_files/
          if-no-files-found: ignore

      - name: Commit database and CSV exports
        if: ${{ github.event_name != 'pull_request' && inputs.canary_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$SEO_DB" data/*.csv data/*.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update SEO tracking data [skip ci]"
            git push
          fi
