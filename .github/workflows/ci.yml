name: CI

on:
  schedule:
    # Every 6 hours. Each run launches every matrix job below.
    - cron: "23 */6 * * *"
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

# Don't let a slow scheduled run overlap with the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  PY_COLORS: "1"
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --show-source --statistics --exclude=temp

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
      - name: Offline parser / storage tests
        run: pytest tests/ -v

  stealth:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- x86 Ubuntu -------------------------------------------------
          - name: uc-basics-ubuntu
            os: ubuntu-latest
            scripts: |
              raw_uc_mode.py --debug
              raw_socialblade.py --debug
              raw_gitlab_uc.py --debug
              raw_cdp_drivers.py
              raw_turnstile.py --debug

          - name: retail-ubuntu
            os: ubuntu-latest
            scripts: |
              my_socialblade.py --debug
              raw_nike.py --debug
              raw_upwork_cdp_mode.py --debug
              raw_gas_records.py --debug
              raw_homedepot.py --debug

          # raw_cdp_mode.py runs here rather than on ARM64, where
          # bot.sannysoft.com reports one failed fingerprint check.
          - name: social-ubuntu
            os: ubuntu-latest
            scripts: |
              raw_gitlab.py --debug
              raw_tiktok.py --debug
              raw_chatgpt.py --debug
              raw_handle_alerts.py --xvfb
              raw_ipify.py
              raw_cdp_mode.py --debug

          - name: cdp-network-ubuntu
            os: ubuntu-latest
            scripts: |
              raw_res_sb.py
              raw_xhr_sb.py
              raw_res_nike.py
              raw_antibot_login.py
              raw_southwest.py

          - name: playwright-ubuntu
            os: ubuntu-latest
            playwright: true
            scripts: |
              playwright/raw_nike_sync.py
              playwright/raw_walmart_sync.py
              playwright/raw_gas_info_sync.py --debug

          # ---- macOS ------------------------------------------------------
          - name: cdp-mode-macos
            os: macos-latest
            scripts: |
              raw_uc_mode.py --debug
              raw_cdp.py --debug
              raw_socialblade.py --debug
              raw_gitlab.py --debug
              raw_turnstile.py --debug
              raw_turnstile_cdp_mode.py --debug
              raw_walmart.py --debug
              raw_cdp_etsy.py --debug

          # ---- ARM64 Ubuntu (system chromium, no chromedriver download) ---
          - name: captcha-arm64
            os: ubuntu-24.04-arm
            arm: true
            scripts: |
              raw_mfa_login.py
              raw_cdp_etsy.py --debug
              raw_wsform.py --debug
              raw_consultapublica.py --debug
              raw_serienstream.py --debug

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          if [ "${{ matrix.playwright }}" = "true" ]; then
            pip install --upgrade playwright
          fi

      - name: Install browser / driver
        run: |
          if [ "${{ matrix.arm }}" = "true" ]; then
            sudo apt-get install -y chromium
          else
            seleniumbase install chromedriver
            seleniumbase install uc_driver
          fi

      - name: Environment info
        run: |
          seleniumbase
          pip show seleniumbase | head -n 2
          python platform_check.py
          python -c "import os; print('cpu_count:', os.cpu_count())"
          python -c "from seleniumbase import undetected; print('chrome:', undetected.find_chrome_executable())"

      - name: Verify pytest + SeleniumBase
        if: matrix.arm != true
        run: |
          echo "def test_0(sb): pass" > verify_sb.py
          pytest verify_sb.py --uc

      - name: Run stealth scripts
        env:
          SCRIPT_TIMEOUT: "600"
        run: |
          # Run one script with a hard time limit so a hung browser cannot
          # consume the whole job (portable: no GNU timeout on macOS).
          run_one() {
            python - "$@" <<'PY'
          import os, subprocess, sys
          limit = int(os.environ.get("SCRIPT_TIMEOUT", "600"))
          try:
              sys.exit(subprocess.run(sys.argv[1:], timeout=limit).returncode)
          except subprocess.TimeoutExpired:
              print("TIMEOUT: no result after %ds" % limit)
              sys.exit(124)
          PY
          }
          failed=()
          while IFS= read -r line; do
            case "$line" in ""|\#*) continue;; esac   # skip blanks/comments
            echo "::group::python $line"
            if run_one python $line; then
              echo "PASS: $line"
            else
              echo "FAIL: $line"
              failed+=("$line")
            fi
            echo "::endgroup::"
          done <<< "${{ matrix.scripts }}"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} script(s) failed:"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ matrix.name }}
          path: |
            ./latest_logs/
            ./downloaded_files/
          if-no-files-found: ignore
