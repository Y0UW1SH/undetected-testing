name: Bittensor wallet collection

on:
  # Refresh indexed evidence for just the watchlist. Five-minute movement
  # checks run on the user's computer; this workflow only uses Taostats.
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "Standard GitHub-hosted runner for the browser"
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
        default: ubuntu-latest
      netuids:
        description: "Subnet IDs, comma-separated (overrides subnets)"
        type: string
      subnets:
        description: "Number of largest subnets to scan (0 = all)"
        type: string
        default: "8"
      top:
        description: "Number of discovered wallets to inspect (0 = all)"
        type: string
        default: "20"
      addresses:
        description: "Additional wallet addresses, comma-separated (optional)"
        type: string
      watch_addresses:
        description: "Add these wallets to the persistent watchlist (comma-separated)"
        type: string
      extrinsics:
        description: "Known native extrinsics to verify (space-separated, optionally ID:event,event)"
        type: string
      addresses_only:
        description: "Skip discovery and inspect the supplied or followed wallets"
        type: boolean
        default: false
      holders_only:
        description: "Resume holder pages and research new queued wallets across the chosen subnets"
        type: boolean
        default: false
      holder_pages:
        description: "Consecutive holder pages per subnet (1-100); saved progress resumes next run"
        type: string
        default: "4"
      new_wallets:
        description: "Maximum extra recipient accounts to inspect this run"
        type: string
        default: "10"
      history_pages:
        description: "Older history pages per tab; resumes next run, plus bounded recent/overlap checks"
        type: string
        default: "3"
      delay:
        description: "Pause between pages in seconds, e.g. 2 or 2-4"
        type: string
        default: "2-4"
      follow_top:
        description: "How many qualifying profitable wallets to follow"
        type: string
        default: "0"

permissions:
  contents: write

# Only one run can update the wallet database at a time.
concurrency:
  group: bittensor-wallet-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ inputs.runner == 'windows-latest' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      STATE_BRANCH: tao-wallet-data
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6

      - name: Restore wallet history
        shell: bash
        run: |
          temp_dir="$RUNNER_TEMP"
          env_file="$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Windows ]]; then
            temp_dir=$(cygpath -am "$temp_dir")
            env_file=$(cygpath -am "$env_file")
          fi
          state="$temp_dir/tao-wallet-state"
          report="$temp_dir/tao-wallet-report/tao_collect.json"
          ref="refs/heads/$STATE_BRANCH"
          if git ls-remote --exit-code origin "$ref" > /dev/null; then
            git fetch --no-tags --depth=1 origin "$ref"
            git worktree add --detach "$state" FETCH_HEAD
            test -s "$state/wallets.sqlite"
          else
            status=$?
            if [[ $status != 2 ]]; then exit "$status"; fi
            git worktree add --detach --no-checkout "$state" HEAD
            git -C "$state" switch --orphan wallet-state-init
          fi
          echo "TAO_DB=$state/wallets.sqlite" >> "$env_file"
          echo "REPORT=$report" >> "$env_file"
          echo "TAO_DIAGNOSTIC_DIR=$temp_dir/tao-wallet-report" >> "$env_file"

      - name: Check scheduled watchlist
        id: watchlist
        if: github.event_name == 'schedule'
        shell: python
        run: |
          import os, sqlite3
          from pathlib import Path
          path = Path(os.environ["TAO_DB"])
          populated = False
          if path.is_file():
              with sqlite3.connect(path) as db:
                  table = db.execute("SELECT 1 FROM sqlite_master WHERE name='followed_wallets'").fetchone()
                  populated = bool(table and db.execute("SELECT 1 FROM followed_wallets LIMIT 1").fetchone())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"skip={str(not populated).lower()}", file=out)

      - uses: actions/setup-python@v6
        if: steps.watchlist.outputs.skip != 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.watchlist.outputs.skip != 'true'
        run: python -m pip install -r requirements.txt

      - name: Collect wallet and subnet data
        id: collect
        if: steps.watchlist.outputs.skip != 'true'
        env:
          NETUIDS: ${{ inputs.netuids }}
          SUBNETS: ${{ inputs.subnets || '1' }}
          TOP: ${{ inputs.top || '1' }}
          ADDRESSES: ${{ inputs.addresses }}
          WATCH_ADDRESSES: ${{ inputs.watch_addresses }}
          ADDRESSES_ONLY: ${{ github.event_name == 'schedule' || inputs.addresses_only }}
          HOLDERS_ONLY: ${{ inputs.holders_only }}
          HOLDER_PAGES: ${{ inputs.holder_pages || '4' }}
          EXTRINSICS: ${{ inputs.extrinsics }}
          NEW_WALLETS: ${{ inputs.new_wallets || '2' }}
          HISTORY_PAGES: ${{ inputs.history_pages || '4' }}
          TAO_DELAY: ${{ inputs.delay || '1-2' }}
          FOLLOW_TOP: ${{ inputs.follow_top || '0' }}
          TAO_PROXY: ${{ secrets.TAO_PROXY }}
        shell: bash
        run: |
          args=(collect --subnets "$SUBNETS" --top "$TOP" --new-wallets "$NEW_WALLETS"
                --history-pages "$HISTORY_PAGES" --follow-top "$FOLLOW_TOP"
                --out "$REPORT")
          if [[ "$ADDRESSES_ONLY" == "true" ]]; then args+=(--addresses-only --history-charts 2); fi
          if [[ "$HOLDERS_ONLY" == "true" ]]; then args+=(--holders-only --holder-pages "$HOLDER_PAGES" --history-charts 8); fi
          if [[ -n "$NETUIDS" ]]; then args+=(--netuids "$NETUIDS"); fi
          if [[ -n "$ADDRESSES" ]]; then
            IFS=, read -ra addresses <<< "$ADDRESSES"
            for address in "${addresses[@]}"; do args+=(--address "$address"); done
          fi
          if [[ -n "$WATCH_ADDRESSES" ]]; then
            IFS=, read -ra watched <<< "$WATCH_ADDRESSES"
            for address in "${watched[@]}"; do args+=(--watch-address "$address"); done
          fi
          if [[ -n "$EXTRINSICS" ]]; then
            read -ra refs <<< "$EXTRINSICS"
            for ref in "${refs[@]}"; do args+=(--extrinsic "$ref"); done
          fi
          if [[ -n "$TAO_PROXY" ]]; then args+=(--proxy "$TAO_PROXY"); fi
          collect=(python -m seo.tao_cli --db "$TAO_DB" "${args[@]}")
          if [[ "$RUNNER_OS" == Windows ]]; then
            "${collect[@]}"
          else
            command -v Xvfb xauth xvfb-run google-chrome >/dev/null
            xvfb-run -a -s "-screen 0 1366x768x24" "${collect[@]}"
          fi

      - name: Summarize coverage and trading results
        if: steps.watchlist.outputs.skip != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: python
        run: |
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path
          from seo.tao_performance_cli import append_summary

          report = json.loads(Path(os.environ["REPORT"]).read_text())
          coverage = report["coverage"].values()

          def account(address):
              if not address or not re.fullmatch(r"[A-Za-z0-9]+", address):
                  return "Unknown"
              label = f"{address[:6]}…{address[-4:]}"
              return f"[{label}](https://taostats.io/account/{address})"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              print("## Wallet collection", file=out)
              unavailable = [tab for tab in ("transactions", "transfers")
                             if not any(c.get(tab) == "complete" or c.get(tab + "_rows", 0)
                                        for c in coverage)]
              if unavailable:
                  print("\n**Partial collection.** No account returned usable "
                        + " or ".join(unavailable) + " history in this run.", file=out)
              for evidence in report.get("extrinsics", []):
                  print(f"\n[Taostats detail]({evidence['url']}) · "
                        f"{evidence.get('status', 'unavailable')}", file=out)

              print(f"Scanned {len(report['metagraph_neurons'])} metagraphs "
                    f"and attempted {len(coverage)} wallet accounts.\n", file=out)
              print(f"Recent trade discovery: {report['recent_trades_status']}. "
                    f"Deferred recipients: {len(report['deferred_recipients'])}.\n", file=out)
              queue = report.get("holder_queue")
              if queue:
                  print("\n### Holder research coverage\n", file=out)
                  print("Holder addresses are candidates, not verified profitable traders. "
                        "Pages resume and wallets are deduplicated across runs.\n", file=out)
                  for name, value in queue.items():
                      print(f"- {name.replace('_', ' ')}: {value}", file=out)
              print("| Page | Complete | Partial | Unavailable | Skipped | Rows fetched this run | Stored tab rows |", file=out)
              print("| --- | ---: | ---: | ---: | ---: | ---: | ---: |", file=out)
              for tab in ("transactions", "transfers"):
                  status = Counter(c.get(tab, "skipped") for c in coverage)
                  rows = sum(c.get(tab + "_rows_this_run", c.get(tab + "_rows", 0)) for c in coverage)
                  stored = sum(c.get(tab + "_rows_cumulative", c.get(tab + "_rows", 0)) for c in coverage)
                  print(f"| {tab} | {status['complete']} | {status['partial']} | "
                        f"{status['unavailable']} | {status['skipped']} | {rows} | {stored} |", file=out)
              print("\n### Per-wallet history progress\n", file=out)
              print("Fetched rows include recent-page refresh and overlap. Stored rows are "
                    "deduplicated table records, not independent winning trades. Partial "
                    "history remains queued for older-page research; missing source totals "
                    "are unknown. Remaining counts rows absent from storage; zero may still "
                    "need older-page verification. Complete means observed explorer history, not a full "
                    "native-chain audit.\n", file=out)
              print("| Wallet | Table | Fetched | New | Stored | Source total | Remaining | Status |", file=out)
              print("| --- | --- | ---: | ---: | ---: | ---: | ---: | --- |", file=out)
              def number(value):
                  return str(value) if type(value) is int and value >= 0 else "unknown"
              for address, item in report["coverage"].items():
                  for tab in ("transactions", "transfers"):
                      progress = item.get(tab + "_history") or {}
                      print(f"| {account(address)} | {tab} | "
                            f"{number(item.get(tab + '_rows_this_run', item.get(tab + '_rows')))} | "
                            f"{number(item.get(tab + '_rows_added'))} | "
                            f"{number(item.get(tab + '_rows_cumulative', item.get(tab + '_rows')))} | "
                            f"{number(progress.get('source_total'))} | "
                            f"{number(progress.get('remaining'))} | "
                            f"{item.get(tab, 'skipped')} |", file=out)
              priced = sum(t["priced_sales"] for t in report["traders"])
              unpriced = sum(report["unpriced_sales"].values())
              if priced:
                  print(f"\nStored history includes {priced} priced sales and "
                        f"{unpriced} unpriced sales.", file=out)
              else:
                  print(f"\nNo priced sales in stored history. Unpriced sales: {unpriced}.", file=out)

              transfers = sorted(report["transfers"], key=lambda e: e["time"], reverse=True)[:5]
              if transfers:
                  print("\n### Recent transfers\n", file=out)
                  print("| Time (UTC) | From | To | Asset | Quantity | Evidence |", file=out)
                  print("| --- | --- | --- | --- | ---: | --- |", file=out)
                  for e in transfers:
                      stake = e["kind"] == "stake_transfer"
                      asset = f"SN{e['netuid']} alpha" if stake else "TAO"
                      quantity = e["alpha"] if stake else e["tao"]
                      label = {"transaction": "Transaction", "coldkey_swap": "Coldkey swap",
                               "snapshot_match": "Snapshot match"}.get(e["evidence"], "Unknown")
                      extrinsic = e.get("extrinsic")
                      if e["evidence"] == "transaction" and re.fullmatch(r"[0-9]+-[0-9]+", str(extrinsic)):
                          label = f"[{extrinsic}](https://taostats.io/extrinsic/{extrinsic}?network=finney)"
                      if e["evidence"] == "snapshot_match":
                          label += f" (score {e['confidence']:.2f})"
                      when = e["time"][:19].replace("T", " ")
                      print(f"| {when} | {account(e['src'])} | {account(e['dst'])} | "
                            f"{asset} | {quantity:.9g} | {label} |", file=out)

              append_summary(report, out)

      - name: Save wallet history
        # Keep verified holder pages and retry timestamps even when every
        # wallet tab was unavailable. The collection still reports failure.
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        shell: bash
        run: |
          state=$(dirname "$TAO_DB")
          git -C "$state" config user.name "github-actions[bot]"
          git -C "$state" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$state" add -- wallets.sqlite
          if ! git -C "$state" diff --cached --quiet; then
            git -C "$state" commit -m "Update wallet history [skip ci]"
            snapshot=$(git -C "$state" rev-parse HEAD)
            git push origin "$snapshot:refs/heads/$STATE_BRANCH"
          fi

      - name: Upload wallet results
        if: ${{ !cancelled() && env.REPORT != '' && steps.watchlist.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: wallet-collection
          path: |
            ${{ env.TAO_DB }}
            ${{ env.REPORT }}
            ${{ env.TAO_DIAGNOSTIC_DIR }}/wallet-verification.png
          if-no-files-found: warn
          retention-days: 3

      - name: Check wallet history coverage
        if: steps.watchlist.outputs.skip != 'true'
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ["REPORT"]).read_text())
          if not report["coverage"] and "holder_queue" in report:
              print("Holder discovery saved. No wallets were eligible for history inspection this run.")
          else:
              for tab in ("transactions", "transfers"):
                  if not any(c.get(tab) == "complete" or c.get(tab + "_rows", 0) for c in report["coverage"].values()):
                      raise SystemExit(f"No wallet returned readable {tab}. The artifact preserves partial data.")
