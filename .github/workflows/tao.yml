name: Bittensor subnets

on:
  schedule:
    # Every 4 hours (minute jittered off :00).
    - cron: "37 */4 * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Alert when price or market cap moves more than this percent"
        default: "10"
      netuids:
        description: "Comma-separated netuids to watch (empty = all / config)"
        default: ""

permissions:
  contents: write

concurrency:
  group: bittensor-subnets
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PY_COLORS: "1"
      # Committed back to the repo so each run can compare with the last.
      TAO_DB: data/tao.sqlite
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: Fetch subnets and compare with the previous run
        env:
          THRESHOLD: ${{ inputs.threshold || '10' }}
          NETUIDS: ${{ inputs.netuids }}
          TAO_PROXY: ${{ secrets.TAO_PROXY }}
        run: |
          ARGS="--threshold $THRESHOLD"
          if [ -n "$NETUIDS" ]; then ARGS="$ARGS --netuids $NETUIDS"; fi
          PROXY_ARG=""
          if [ -n "$TAO_PROXY" ]; then PROXY_ARG="--proxy $TAO_PROXY"; fi
          python -m seo.tao_cli --db "$TAO_DB" $PROXY_ARG watch $ARGS

      - name: Report and export
        if: always()
        run: |
          python -m seo.tao_cli --db "$TAO_DB" report \
            --threshold "${{ inputs.threshold || '10' }}"
          python -m seo.tao_cli --db "$TAO_DB" export --format csv

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tao-results
          path: |
            data/
            downloaded_files/
          if-no-files-found: ignore

      - name: Commit database, CSV and report
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$TAO_DB" data/subnet_stats.csv data/tao_report.html \
            data/tao_alerts.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Bittensor subnet data [skip ci]"
            # Other workflows commit data too; rebase and retry.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin master && git push && break
              echo "push attempt $attempt failed; retrying"; sleep 10
            done
          fi
