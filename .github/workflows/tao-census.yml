name: Taostats account census
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "One manual chunk, or a finite series to traverse the directory"
        type: choice
        options:
          - chunk
          - full
        default: chunk
      pages:
        description: "Pages for a manual chunk (1–100); full mode uses 100 per chunk"
        default: "8"
        type: string
      delay:
        description: "Pause between pages in seconds (full mode: 1–6, e.g. 1-2)"
        default: "2"
        type: string
      full_chunks:
        description: "Maximum remaining 100-page chunks for a full series (1–80)"
        default: "80"
        type: string
      checkpoint:
        description: "Continuation checkpoint commit (leave empty when starting a run)"
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: taostats-account-census
  cancel-in-progress: false
  queue: max
jobs:
  census:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      continue: ${{ steps.scan.outputs.continue }}
      checkpoint: ${{ steps.scan.outputs.commit }}
      remaining: ${{ steps.scan.outputs.remaining }}
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      STATE: tao-account-registry
    steps:
      - uses: actions/checkout@v6
      - name: Open census state branch
        shell: bash
        timeout-minutes: 4
        run: |
          echo "CENSUS_JOB_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          dir="$RUNNER_TEMP/census-state"
          ref="refs/heads/$STATE"
          if git ls-remote --exit-code origin "$ref" > /dev/null; then
            git fetch --depth=1 --no-tags origin "$ref"
            git worktree add --detach "$dir" FETCH_HEAD
            if [[ ! -s "$dir/census-checkpoint.json" && ! -s "$dir/accounts.sqlite" ]]; then
              echo "::error::State branch is missing its checkpoint"; exit 1
            fi
          else
            status=$?
            if [[ $status != 2 ]]; then exit "$status"; fi
            git worktree add --detach --no-checkout "$dir" HEAD
            git -C "$dir" switch --orphan init-census
          fi
          git -C "$dir" config user.name "github-actions[bot]"
          git -C "$dir" config user.email "github-actions[bot]@users.noreply.github.com"
          echo "STATE_DIR=$dir" >> "$GITHUB_ENV"
          echo "DB=$RUNNER_TEMP/accounts.sqlite" >> "$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/account-census.json" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        timeout-minutes: 8
        run: python -m pip install -r requirements.txt
      - name: Scan and save each checkpoint
        id: scan
        env:
          MODE: ${{ inputs.mode || 'chunk' }}
          PAGES: ${{ inputs.pages || '8' }}
          DELAY: ${{ inputs.delay || '2' }}
          REMAINING: ${{ inputs.full_chunks || '80' }}
          EXPECTED: ${{ inputs.checkpoint }}
        run: |
          xvfb-run -a -s "-screen 0 1366x768x24" python -m tools.tao_census_workflow run \
            --state "$STATE_DIR" --db "$DB" --out "$REPORT" --branch "$STATE" \
            --mode "$MODE" --pages "$PAGES" --delay "$DELAY" \
            --remaining "$REMAINING" --expected "$EXPECTED"
      - name: Upload census result
        if: ${{ !cancelled() && env.REPORT != '' && (inputs.mode != 'full' || steps.scan.outputs.complete == 'true' || failure()) }}
        uses: actions/upload-artifact@v6
        with:
          name: taostats-account-census
          path: |
            ${{ env.DB }}
            ${{ env.REPORT }}
          if-no-files-found: warn
          retention-days: 3
      - name: Upload intermediate full-run summary
        if: ${{ success() && inputs.mode == 'full' && steps.scan.outputs.continue == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: taostats-account-progress
          path: ${{ env.REPORT }}
          if-no-files-found: error
          retention-days: 1

  continue-census:
    needs: census
    if: needs.census.result == 'success' && needs.census.outputs.continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Queue one bounded continuation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DELAY: ${{ inputs.delay }}
          REMAINING: ${{ needs.census.outputs.remaining }}
          CHECKPOINT: ${{ needs.census.outputs.checkpoint }}
        run: |
          gh workflow run tao-census.yml --repo "$REPO" --ref master \
            -f mode=full -f "full_chunks=$REMAINING" -f "delay=$DELAY" \
            -f "checkpoint=$CHECKPOINT"
