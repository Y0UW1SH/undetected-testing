name: Taostats account census
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Number of Accounts directory pages to read in this pass (1–100)"
        default: "8"
        type: string
      delay:
        description: "Pause between page requests (seconds)"
        default: "2"
        type: string
permissions:
  contents: write
concurrency:
  group: taostats-account-census
  cancel-in-progress: false
jobs:
  census:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      STATE: tao-account-registry
    steps:
      - uses: actions/checkout@v6
      - name: Restore census checkpoint
        shell: bash
        run: |
          dir="$RUNNER_TEMP/census-state"
          if git ls-remote --exit-code origin "refs/heads/$STATE" > /dev/null; then
            git fetch --depth=1 --no-tags origin "refs/heads/$STATE"
            git worktree add --detach "$dir" FETCH_HEAD
            test -s "$dir/accounts.sqlite"
          else
            status=$?
            if [[ $status != 2 ]]; then exit "$status"; fi
            git worktree add --detach --no-checkout "$dir" HEAD
            git -C "$dir" switch --orphan init-census
          fi
          echo "DB=$dir/accounts.sqlite" >> "$GITHUB_ENV"
          echo "REPORT=$RUNNER_TEMP/account-census.json" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Read native Accounts table
        env:
          PAGES: ${{ inputs.pages }}
          DELAY: ${{ inputs.delay }}
        run: |
          [[ "$PAGES" =~ ^[0-9]{1,3}$ && "$PAGES" -ge 1 && "$PAGES" -le 100 ]]
          xvfb-run -a -s "-screen 0 1366x768x24" python -m seo.sources.tao_census --db "$DB" --out "$REPORT" --pages "$PAGES" --page-size 100 --sample-last --delay "$DELAY"
      - name: Preserve checkpoint
        if: ${{ !cancelled() && env.DB != '' }}
        run: |
          if [[ ! -s "$DB" ]]; then exit 0; fi
          dir=$(dirname "$DB")
          git -C "$dir" config user.name "github-actions[bot]"
          git -C "$dir" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$dir" add -- accounts.sqlite
          if ! git -C "$dir" diff --cached --quiet; then
            git -C "$dir" commit -m "Save Taostats account census checkpoint [skip ci]"
            git push origin "$(git -C "$dir" rev-parse HEAD):refs/heads/$STATE"
          fi
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && env.REPORT != '' }}
        with:
          name: taostats-account-census
          path: |
            ${{ env.DB }}
            ${{ env.REPORT }}
          retention-days: 3
