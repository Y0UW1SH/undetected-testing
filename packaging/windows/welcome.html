<h1>No saved wallet report yet</h1>
<p>Open <strong>Stealth Wallet Monitor</strong> from the Windows Start menu. Choose <strong>Import backup</strong> to open the reports you brought from another PC, or choose <strong>Download latest</strong> to get a saved GitHub scan.</p>
<p>After import or download, choose <strong>Open report</strong>. Saved reports can be read offline.</p>
